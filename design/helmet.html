<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Space+Mono:wght@400;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
/* ===== FANCY/CODD Desktop — Phosphor Console, desktop density (shared, paste verbatim) ===== */
body{margin:0;background:#050505}
a{color:#ffb84a}a:hover{color:#f5ecd6}
.codd{
  --bg:#050505;--bg-soft:#0a0a0a;--bg-lift:#111111;--bg-raise:#161616;
  --line:#1a1a1a;--line-bright:#2a2a2a;
  --amber:#ffb84a;--amber-dim:#e09a2c;--amber-glow:rgba(255,184,74,.22);
  --cream:#f5ecd6;--bone:#d4cdb8;--dim:#a8a298;--dimmer:#7a7468;
  --cyan:#6ee0f0;--danger:#ff7058;--success:#7cff9a;--success-dim:#52c472;
  --t-red:#ef5b5b;--t-blue:#5b8def;--t-green:#4ec9b0;--t-yellow:#e6c84e;
  --t-purple:#b07cff;--t-orange:#ff9b4e;--t-pink:#ff7cb5;--t-cyan:#4ed1e6;
  --mono:'JetBrains Mono','PingFang TC','Noto Sans TC',ui-monospace,Menlo,monospace;
  --display:'Space Mono','JetBrains Mono','PingFang TC','Noto Sans TC',monospace;
  --cjk:'PingFang TC','Noto Sans TC',sans-serif;
  position:relative;box-sizing:border-box;background:var(--bg);color:var(--cream);
  font-family:var(--mono);font-size:13px;line-height:1.5;letter-spacing:.01em;
  font-variant-ligatures:none;font-feature-settings:'calt' 0;-webkit-font-smoothing:antialiased;
}
.codd *,.codd *::before,.codd *::after{box-sizing:border-box}
.codd ::selection{background:var(--amber);color:#000}
.codd p{margin:0}
/* CRT overlay (tweak: full | subtle | off) */
.codd.crt-subtle::after,.codd.crt-full::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:95;mix-blend-mode:screen;
  background:repeating-linear-gradient(to bottom,rgba(255,176,0,.014) 0,rgba(255,176,0,.014) 1px,transparent 1px,transparent 3px)}
.codd.crt-full::after{background:repeating-linear-gradient(to bottom,rgba(255,176,0,.028) 0,rgba(255,176,0,.028) 1px,transparent 1px,transparent 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.42) 100%)}
.codd .num{font-variant-numeric:tabular-nums}
.codd .cjk{font-family:var(--cjk)}
.codd .mono{font-family:var(--mono)}
.codd .disp{font-family:var(--display)}
.codd .muted{color:var(--dim)}
.codd .faint{color:var(--dimmer)}
.codd .amber{color:var(--amber)}
.codd .cream{color:var(--cream)}
.codd .ok{color:var(--success)}
.codd .bad{color:var(--danger)}
.codd .cy{color:var(--cyan)}
.codd .caps{text-transform:uppercase;letter-spacing:.14em}
.codd .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ---------- Buttons ---------- */
.codd button{font:inherit;color:inherit}
.codd .btn{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;font-weight:500;background:transparent;color:var(--cream);
  border:1px solid var(--line-bright);padding:3px 10px;min-height:28px;border-radius:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;transition:all 80ms ease-out}
.codd .btn::before{content:'[';color:var(--dim)}
.codd .btn::after{content:']';color:var(--dim)}
.codd .btn:hover,.codd .btn.hover{border-color:var(--amber);color:var(--amber);box-shadow:0 0 16px var(--amber-glow),inset 0 0 8px var(--amber-glow)}
.codd .btn:hover::before,.codd .btn:hover::after,.codd .btn.hover::before,.codd .btn.hover::after{color:var(--amber)}
.codd .btn.primary{background:var(--amber);color:#000;border-color:var(--amber)}
.codd .btn.primary::before,.codd .btn.primary::after{color:#000}
.codd .btn.primary:hover{background:var(--cream);border-color:var(--cream);color:#000}
.codd .btn.danger{border-color:var(--danger);color:var(--danger)}
.codd .btn.danger::before,.codd .btn.danger::after{color:var(--danger)}
.codd .btn.danger:hover{background:var(--danger);color:#000;box-shadow:0 0 16px rgba(255,90,60,.4)}
.codd .btn.accent{color:var(--amber);border-color:var(--amber-dim)}
.codd .btn.accent::before,.codd .btn.accent::after{color:var(--amber-dim)}
.codd .btn.sm{font-size:10.5px;padding:1px 7px;min-height:22px;gap:4px}
.codd .btn.plain::before,.codd .btn.plain::after{content:none}
.codd .btn[disabled]{opacity:.4;cursor:not-allowed}
.codd .icon-btn{background:transparent;border:1px solid transparent;color:var(--dim);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:0;flex:none;font-size:14px;line-height:1}
.codd .icon-btn:hover{color:var(--amber);border-color:var(--line-bright)}
.codd .icon-btn.on{color:var(--amber);border-color:var(--amber-dim);box-shadow:inset 0 0 8px var(--amber-glow)}
.codd .icon-btn svg,.codd .ico{width:16px;height:16px;display:block;flex:none}
.codd .pillbtn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--line-bright);background:transparent;color:var(--bone);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.codd .pillbtn:hover,.codd .pillbtn.on{color:var(--amber);border-color:var(--amber-dim)}

/* ---------- Inputs ---------- */
.codd .input,.codd .select{font-family:var(--mono);font-size:12.5px;background:var(--bg-soft);color:var(--cream);border:1px solid var(--line-bright);border-radius:0;padding:5px 9px;min-height:30px;caret-color:var(--amber);width:100%}
.codd .input::placeholder{color:var(--dimmer)}
.codd .input:focus,.codd .input.focus,.codd .select:focus{outline:none;border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber),0 0 8px var(--amber-glow)}
.codd .select{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--amber) 50%),linear-gradient(135deg,var(--amber) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.codd .lbl{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.codd .hint{font-size:11.5px;color:var(--dimmer);letter-spacing:.02em}
.codd .field{display:flex;flex-direction:column;gap:6px}
.codd input[type=checkbox],.codd input[type=radio]{accent-color:var(--amber);margin:0}
/* switch: <button class="sw on" role="switch" aria-checked="true" aria-label="..."></button> */
.codd .sw{width:30px;height:16px;border:1px solid var(--line-bright);background:var(--bg);position:relative;display:inline-block;flex:none;padding:0;cursor:pointer}
.codd .sw::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--dimmer);transition:left 120ms}
.codd .sw.on{border-color:var(--amber-dim);background:rgba(255,184,74,.12)}
.codd .sw.on::after{left:16px;background:var(--amber);box-shadow:0 0 6px var(--amber-glow)}
/* segmented */
.codd .seg{display:inline-flex;border:1px solid var(--line-bright);flex:none}
.codd .seg button{background:transparent;border:0;border-right:1px solid var(--line-bright);color:var(--dim);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:0 10px;height:24px;cursor:pointer;font-family:var(--mono)}
.codd .seg button:last-child{border-right:0}
.codd .seg button.on{background:var(--amber);color:#000;font-weight:700}
.codd .seg button:hover:not(.on){color:var(--amber)}

/* ---------- Type helpers ---------- */
.codd .sec{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.codd .h-page{font-family:var(--display);font-weight:700;font-size:26px;color:var(--amber);text-shadow:0 0 12px var(--amber-glow);letter-spacing:.02em;margin:0;line-height:1.2}
.codd .h-sub{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:0}
.codd .meta-rule{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.codd .meta-rule::before,.codd .meta-rule::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line-bright),transparent)}
.codd .meta-rule::after{background:linear-gradient(90deg,transparent,var(--line-bright))}
.codd .comment{color:var(--dimmer);font-size:12px}
.codd .cursor{color:var(--amber);animation:codd-blink 1s steps(1) infinite}
.codd code,.codd .code{font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--amber);border:1px solid var(--line);padding:0 5px}
.codd .path{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--bg-soft);border:1px solid var(--line);padding:1px 8px}

/* ---------- Cards / panels ---------- */
.codd .card{background:var(--bg-soft);border:1px solid var(--line-bright);padding:16px 18px;position:relative}
.codd .card::before{content:'┌─';position:absolute;top:-1px;left:-1px;background:var(--bg);color:var(--amber-dim);padding:0 4px;font-size:11px;line-height:1;transform:translateY(-50%)}
.codd .card::after{content:'─┘';position:absolute;bottom:-1px;right:-1px;background:var(--bg);color:var(--amber-dim);padding:0 4px;font-size:11px;line-height:1;transform:translateY(50%)}
.codd .card.hot{border-color:var(--amber-dim)}
.codd .card h3,.codd .card .card-h{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:0 0 12px;border-bottom:1px dashed var(--line-bright);padding-bottom:6px;font-weight:700;display:flex;align-items:center;gap:8px}
.codd .panel{background:var(--bg-soft);border:1px solid var(--line-bright)}
.codd .dash-top{border-top:1px dashed var(--line)}
.codd .dash-bot{border-bottom:1px dashed var(--line)}

/* ---------- Chips / kbd ---------- */
.codd .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-bright);padding:0 7px;height:20px;font-size:11px;letter-spacing:.03em;color:var(--bone);white-space:nowrap;background:transparent}
.codd .chip.amber{color:var(--amber);border-color:var(--amber-dim)}
.codd .chip.ok{color:var(--success);border-color:rgba(124,255,154,.4)}
.codd .chip.cy{color:var(--cyan);border-color:rgba(110,224,240,.4)}
.codd .chip.bad{color:var(--danger);border-color:rgba(255,112,88,.45)}
.codd .chip.fill{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
.codd .chip.caps{text-transform:uppercase;letter-spacing:.1em;font-size:10px}
.codd .kbd{display:inline-flex;align-items:center;border:1px solid var(--line-bright);padding:0 5px;height:18px;font-size:10.5px;color:var(--dim);letter-spacing:0;font-family:var(--mono);background:var(--bg)}
.codd .badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:15px;padding:0 4px;background:var(--amber);color:#000;font-size:10px;font-weight:700;line-height:15px;box-shadow:0 0 10px var(--amber-glow);font-variant-numeric:tabular-nums}
.codd .badge.cy{background:var(--cyan);box-shadow:none}
.codd .badge.bad{background:var(--danger);box-shadow:none}
.codd .badge.dim{background:var(--line-bright);color:var(--bone);box-shadow:none}
.codd .tag{display:inline-block;width:8px;height:8px;flex:none}
.codd .tag.lg{width:10px;height:10px;box-shadow:0 0 6px currentColor}

/* ---------- Session states (glyph + color, double encoded) ---------- */
.codd .st-waiting{--st:var(--amber)}
.codd .st-error{--st:var(--danger)}
.codd .st-busy{--st:var(--success)}
.codd .st-compacting{--st:var(--success-dim)}
.codd .st-done{--st:var(--cyan)}
.codd .st-idle{--st:var(--cyan)}
.codd .st-starting{--st:var(--bone)}
.codd .st-unknown{--st:var(--bone)}
.codd .st-shell{--st:var(--bone)}
.codd .st-exited{--st:var(--dimmer)}
.codd .st-stopped{--st:var(--dimmer)}
.codd .lamp{display:inline-flex;align-items:center;justify-content:center;width:12px;flex:none;font-size:11px;line-height:1;color:var(--st,var(--bone))}
.codd .st-waiting .lamp,.codd .lamp.st-waiting{font-size:12px;animation:codd-lamp 1.1s ease-in-out infinite}
.codd .st-busy .lamp,.codd .lamp.st-busy{text-shadow:0 0 6px rgba(124,255,154,.55)}
.codd .st-unknown .lamp,.codd .lamp.st-unknown{opacity:.6}
.codd .st-starting .lamp,.codd .lamp.st-starting{animation:codd-soft 1.2s ease-in-out infinite}
.codd .state{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:0 5px;height:15px;border:1px solid var(--st);color:var(--st);white-space:nowrap;flex:none;font-weight:500}
.codd .st-waiting .state,.codd .state.st-waiting{background:var(--amber);color:#000;font-weight:700;box-shadow:0 0 8px var(--amber-glow)}
.codd .st-done .state,.codd .state.st-done{background:var(--cyan);color:#000;font-weight:700}
.codd .st-idle .state,.codd .state.st-idle,.codd .st-shell .state,.codd .state.st-shell,.codd .st-exited .state,.codd .state.st-exited,.codd .st-stopped .state,.codd .state.st-stopped{border-color:transparent;padding:0 2px}
.codd .stchip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:0 7px;height:20px;border:1px solid var(--st);color:var(--st);white-space:nowrap}
.codd .st-waiting .stchip,.codd .stchip.st-waiting{background:rgba(255,184,74,.12)}
.codd .st-error .stchip,.codd .stchip.st-error{background:rgba(255,112,88,.10)}

/* ---------- Window shell ---------- */
.codd.win{width:100%;height:900px;display:flex;flex-direction:row;flex-wrap:wrap;overflow:hidden}
.codd .tl{position:absolute;top:19px;left:18px;display:flex;gap:8px;z-index:60}
.codd .tl i{width:12px;height:12px;border-radius:50%;display:block;background:#3a3a3c}
.codd .tl i:nth-child(1){background:#ff5f57}.codd .tl i:nth-child(2){background:#febc2e}.codd .tl i:nth-child(3){background:#28c840}
.codd .rail{flex:0 0 72px;height:900px;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:56px 0 10px;gap:4px}
.codd .rail .ri{width:60px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);text-decoration:none;font-size:9px;letter-spacing:.06em;text-transform:uppercase;position:relative;border:1px solid transparent}
.codd .rail .ri svg{width:20px;height:20px}
.codd .rail .ri:hover{color:var(--cream)}
.codd .rail .ri.on{color:var(--amber);background:linear-gradient(90deg,var(--amber-glow),transparent 85%);box-shadow:inset 2px 0 0 var(--amber);text-shadow:0 0 6px var(--amber-glow)}
.codd .rail .ri .badge{position:absolute;top:2px;right:6px}
.codd .rail .grow{flex:1}
.codd .rail .acct{width:56px;border:1px solid var(--line-bright);padding:5px 5px 6px;display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--bone);text-decoration:none;background:var(--bg-soft)}
.codd .rail .acct .mini{height:3px;background:var(--line-bright);position:relative}
.codd .rail .acct .mini b{position:absolute;inset:0 auto 0 0;background:var(--tone,var(--success))}
.codd .side{flex:0 0 280px;height:900px;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.codd .side-head{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;border-bottom:1px dashed var(--line)}
.codd .brand{font-family:var(--display);font-weight:700;font-size:15px;color:var(--amber);text-shadow:0 0 8px var(--amber-glow);letter-spacing:.04em;white-space:nowrap;text-decoration:none}
.codd .side-scroll{flex:1;min-height:0;overflow:hidden;padding:8px 6px 12px;display:flex;flex-direction:column;gap:1px}
.codd .side-scroll>*{flex-shrink:0}
.codd .side-foot{flex:none;border-top:1px dashed var(--line);padding:8px 12px 10px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.codd .main{flex:999 1 560px;min-width:0;height:900px;display:flex;flex-direction:column;background:var(--bg);position:relative}
.codd .statusbar{height:24px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);background:var(--bg-soft);font-size:10.5px;color:var(--dim);letter-spacing:.04em;white-space:nowrap;overflow:hidden}

/* ---------- Sidebar tree ---------- */
.codd .sbsec{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);background:transparent;border:0;width:100%;text-align:left;cursor:pointer;font-family:var(--mono)}
.codd .sbsec .cnt{color:var(--amber-dim);font-variant-numeric:tabular-nums;letter-spacing:0}
.codd .sbsec .rule{flex:1;border-top:1px dashed var(--line);margin-left:4px}
.codd .needs{border:1px solid rgba(255,184,74,.28);background:linear-gradient(180deg,rgba(255,184,74,.05),transparent);margin:2px 0 6px}
.codd .needs .sbsec{color:var(--amber)}
.codd .grp{display:flex;align-items:center;gap:7px;padding:0 6px 0 6px;height:28px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone);width:100%;background:transparent;border:0;cursor:pointer;font-family:var(--mono);text-align:left;margin-top:6px}
.codd .grp:hover{color:var(--cream);background:var(--bg-soft)}
.codd .caret{display:inline-block;width:10px;color:var(--dimmer);transition:transform 120ms;font-size:10px;flex:none;text-align:center}
.codd .open>.caret,.codd .caret.open{transform:rotate(90deg)}
.codd .agg{margin-left:auto;display:inline-flex;gap:7px;font-size:10px;letter-spacing:0;color:var(--dim);font-variant-numeric:tabular-nums}
.codd .agg span{display:inline-flex;align-items:center;gap:2px}
.codd .agg .lamp{width:auto;font-size:9px}
.codd .proj{display:flex;align-items:center;gap:6px;padding:0 6px 0 16px;height:24px;font-size:11.5px;color:var(--dim);width:100%;background:transparent;border:0;cursor:pointer;font-family:var(--mono);text-align:left}
.codd .proj .pname{color:var(--bone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.codd .proj:hover .pname{color:var(--cream)}
.codd .proj .pcount{margin-left:auto;font-size:10px;color:var(--dimmer)}
.codd .srow{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px 8px 4px 24px;min-height:38px;border:0;border-left:2px solid transparent;background:transparent;color:var(--bone);width:100%;text-align:left;cursor:pointer;font-family:var(--mono);text-decoration:none;position:relative}
.codd .srow.flat{padding-left:10px}
.codd .srow .l1{display:flex;align-items:center;gap:7px;min-width:0}
.codd .srow .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.codd .srow .l2{display:flex;align-items:center;gap:6px;padding-left:19px;font-size:10.5px;color:var(--dimmer);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.codd .srow .l2 .dur{color:var(--st,var(--dimmer))}
.codd .srow:hover{background:var(--bg-soft);border-left-color:var(--line-bright)}
.codd .srow.current{background:var(--bg-lift);border-left-color:var(--amber)}
.codd .srow.current .title{color:var(--cream)}
.codd .srow.st-waiting{background:linear-gradient(90deg,rgba(255,184,74,.09),rgba(255,184,74,.02));border-left-color:var(--amber)}
.codd .srow.st-waiting .title{color:var(--cream)}
.codd .srow.st-waiting.current{background:linear-gradient(90deg,rgba(255,184,74,.16),rgba(255,184,74,.04))}
.codd .srow.st-error{background:linear-gradient(90deg,rgba(255,112,88,.08),rgba(255,112,88,.015));border-left-color:var(--danger)}
.codd .srow.st-exited .title,.codd .srow.st-stopped .title{color:var(--dimmer)}
.codd .srow.sel{outline:1px solid var(--amber-dim);outline-offset:-1px;background:rgba(255,184,74,.06)}
.codd .srow .grip{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--dimmer);font-size:10px;opacity:0}
.codd .srow:hover .grip{opacity:.7}
.codd .ext{font-size:9px;letter-spacing:.12em;color:var(--dim);border:1px dashed var(--line-bright);padding:0 4px;line-height:13px}
.codd .addrow{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;margin-top:8px;border:1px dashed var(--line-bright);color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:transparent;cursor:pointer;font-family:var(--mono);width:100%}
.codd .addrow:hover{color:var(--amber);border-color:var(--amber-dim)}

/* ---------- Session pane ---------- */
.codd .sh{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;background:var(--bg-soft);border-bottom:1px solid var(--line-bright)}
.codd .sh .ident{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.codd .sh .l1{display:flex;align-items:center;gap:9px;min-width:0}
.codd .sh .ttl{font-family:var(--display);font-weight:700;font-size:15px;color:var(--amber);text-shadow:0 0 10px var(--amber-glow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.codd .sh .meta{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.codd .sh .meta .sep{color:var(--dimmer)}
.codd .sh .acts{display:flex;align-items:center;gap:4px;flex:none}
.codd .tabs{height:30px;flex:none;display:flex;align-items:stretch;background:var(--bg-soft);border-bottom:1px solid var(--line-bright)}
.codd .tab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0 14px;display:inline-flex;align-items:center;gap:7px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer;white-space:nowrap}
.codd .tab:hover{color:var(--cream)}
.codd .tab.on{color:var(--amber);background:var(--bg);box-shadow:inset 0 2px 0 var(--amber)}
.codd .tab.on .tlabel::after{content:'_';margin-left:2px;animation:codd-blink 1s steps(1) infinite}
.codd .tab .x{color:var(--dimmer);font-size:10px;margin-left:2px}
.codd .tabs .tfill{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 10px;font-size:10.5px;color:var(--dimmer)}
.codd .term{flex:1;min-height:0;background:#000;color:#e8e6d8;font-family:'JetBrains Mono','PingFang TC','Noto Sans TC',monospace;font-size:12.5px;line-height:1.45;padding:10px 16px;white-space:pre;overflow:hidden;margin:0;letter-spacing:0}
.codd .term .d{color:#8a8578}
.codd .term .w{color:#ffffff;font-weight:700}
.codd .term .a{color:var(--amber)}
.codd .term .g{color:#7cff9a}
.codd .term .c{color:#6ee0f0}
.codd .term .r{color:#ff7058}
.codd .term .cc{color:#e0896a}
.codd .term .inv{background:#e8e6d8;color:#000}
.codd .term .cur{background:var(--amber);color:#000}
.codd .term .add{background:rgba(124,255,154,.10);color:#b8f5c6}
.codd .term .del{background:rgba(255,112,88,.10);color:#ffb1a3}
.codd .answerbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;background:linear-gradient(90deg,rgba(255,184,74,.10),rgba(255,184,74,.02));border-top:1px solid var(--amber-dim);font-size:12px}
.codd .keybtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;background:var(--bg);border:1px solid var(--line-bright);color:var(--cream);font-size:11.5px;cursor:pointer;font-family:var(--mono);letter-spacing:.04em}
.codd .keybtn .k{color:#000;background:var(--amber);padding:0 4px;font-weight:700;font-size:10.5px}
.codd .keybtn:hover{border-color:var(--amber);color:var(--amber);box-shadow:inset 0 0 8px var(--amber-glow)}
.codd .keybtn.danger{color:var(--danger);border-color:rgba(255,112,88,.45)}
.codd .keybtn.danger .k{background:var(--danger)}
.codd .banner{flex:none;display:flex;align-items:center;gap:10px;padding:7px 12px 7px 16px;font-size:12px;border-bottom:1px solid var(--line-bright)}
.codd .banner.bad{background:linear-gradient(90deg,rgba(255,112,88,.12),rgba(255,112,88,.02));border-color:rgba(255,112,88,.45);color:var(--cream)}
.codd .banner.warn{background:linear-gradient(90deg,var(--amber-glow),transparent 70%),var(--bg-soft);border-color:var(--amber-dim)}
.codd .composer{flex:none;display:flex;gap:8px;align-items:flex-end;padding:8px 10px 8px 12px;background:var(--bg-soft);border-top:1px solid var(--line)}
.codd .composer .ta{flex:1;min-height:40px;background:var(--bg);border:1px solid var(--line-bright);color:var(--cream);font-family:var(--mono),var(--cjk);font-size:12.5px;padding:8px 10px;line-height:1.5}

/* ---------- Bars / meters ---------- */
.codd .tone-ok{--tone:var(--success)}.codd .tone-warn{--tone:var(--amber)}.codd .tone-crit{--tone:var(--danger)}.codd .tone-muted{--tone:var(--dimmer)}
.codd .bar10{position:relative;display:block;height:7px;background:var(--line-bright);-webkit-mask-image:repeating-linear-gradient(90deg,#000 0 calc(10% - 1px),transparent calc(10% - 1px) 10%);mask-image:repeating-linear-gradient(90deg,#000 0 calc(10% - 1px),transparent calc(10% - 1px) 10%);flex:1;min-width:40px}
.codd .bar10 b{position:absolute;inset:0 auto 0 0;background:var(--tone,var(--success))}
.codd .meter{height:2px;background:var(--line-bright);position:relative;display:block}
.codd .meter b{position:absolute;inset:0 auto 0 0;background:var(--tone,var(--amber-dim))}
.codd .qrow{display:flex;align-items:center;gap:8px;font-size:11px;font-variant-numeric:tabular-nums}
.codd .qrow .k{width:22px;color:var(--dim)}
.codd .qrow .v{width:34px;text-align:right;color:var(--tone,var(--cream))}

/* ---------- Menus / popovers / toast / modal ---------- */
.codd .menu{background:var(--bg-lift);border:1px solid var(--amber-dim);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 18px rgba(255,184,74,.08);padding:4px;min-width:220px;display:flex;flex-direction:column;z-index:70}
.codd .menu .mh{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:6px 10px 4px}
.codd .menu .mi{display:flex;align-items:center;gap:10px;padding:0 10px;height:28px;font-size:12px;color:var(--bone);background:transparent;border:0;text-align:left;font-family:var(--mono);cursor:pointer;width:100%;text-decoration:none;white-space:nowrap}
.codd .menu .mi:hover,.codd .menu .mi.hl{background:var(--bg-raise);box-shadow:inset 2px 0 0 var(--amber);color:var(--cream)}
.codd .menu .mi .g{width:14px;text-align:center;color:var(--dim);flex:none}
.codd .menu .mi .k{margin-left:auto;color:var(--dimmer);font-size:10.5px;letter-spacing:.04em}
.codd .menu .mi.danger,.codd .menu .mi.danger .g{color:var(--danger)}
.codd .menu .sep{height:0;border-top:1px dashed var(--line-bright);margin:4px 2px}
.codd .pop{background:var(--bg-soft);border:1px solid var(--line-bright);box-shadow:0 8px 30px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.6);z-index:70}
.codd .toast{display:inline-flex;align-items:center;gap:12px;background:var(--bg-lift);border:1px solid var(--line-bright);box-shadow:0 10px 30px rgba(0,0,0,.6);padding:6px 8px 6px 12px;font-size:12px;color:var(--bone);z-index:80}
.codd .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(2px);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding-top:64px}
.codd .modal{background:var(--bg-soft);border:1px solid var(--amber-dim);box-shadow:0 0 60px rgba(255,184,74,.10),0 20px 60px rgba(0,0,0,.7);width:680px;max-width:calc(100% - 32px);display:flex;flex-direction:column}
.codd .modal .m-h{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);padding:14px 20px 12px;border-bottom:1px dashed var(--line-bright);margin:0;font-weight:700}
.codd .modal .m-b{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.codd .modal .m-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 20px;border-top:1px dashed var(--line)}
.codd .swatches{display:flex;gap:6px;align-items:center}
.codd .sw8{width:20px;height:20px;border:1px solid transparent;padding:0;cursor:pointer;flex:none}
.codd .sw8.on{border-color:var(--cream);outline:1px solid var(--amber);outline-offset:2px}
.codd .sw8.none{background:transparent;border-color:var(--line-bright);color:var(--dim);font-size:11px;line-height:18px;text-align:center}
.codd .spark{display:block;width:100%;height:28px}
.codd .spark polyline{fill:none;stroke:var(--amber-dim);stroke-width:1.25}

/* ---------- Groups = tinted blocks (淺底色分群, v2) ----------
   <div class="gblk g-blue"> <button class="grp">…</button> projects + rows… </div>
   collapsed: add .closed · ungrouped: .gblk.none · drag target: .gblk.drop */
.codd .gblk{--g:var(--dimmer);margin-top:5px;padding-bottom:3px;display:flex;flex-direction:column;gap:1px;flex-shrink:0;
  background:color-mix(in srgb,var(--g) 7%,transparent);border:1px solid color-mix(in srgb,var(--g) 17%,transparent)}
.codd .gblk.closed{padding-bottom:0}
.codd .gblk.none{background:transparent;border:1px dashed var(--line-bright)}
.codd .gblk.drop{background:color-mix(in srgb,var(--g) 15%,transparent);outline:1px dashed var(--amber);outline-offset:-1px}
.codd .gblk>.grp{margin:0;height:22px;padding:0 6px;gap:6px;font-size:9.5px;letter-spacing:.16em;color:color-mix(in srgb,var(--g) 62%,var(--cream))}
.codd .gblk.none>.grp{color:var(--dim)}
.codd .gblk>.grp:hover{background:color-mix(in srgb,var(--g) 12%,transparent);color:var(--cream)}
.codd .gblk>.grp .agg{gap:6px}
.codd .gblk .proj{padding-left:14px;height:22px}
.codd .gblk .srow:hover{background:color-mix(in srgb,var(--g) 13%,transparent);border-left-color:color-mix(in srgb,var(--g) 45%,transparent)}
.codd .g-red{--g:var(--t-red)}.codd .g-blue{--g:var(--t-blue)}.codd .g-green{--g:var(--t-green)}.codd .g-yellow{--g:var(--t-yellow)}
.codd .g-purple{--g:var(--t-purple)}.codd .g-orange{--g:var(--t-orange)}.codd .g-pink{--g:var(--t-pink)}.codd .g-cyan{--g:var(--t-cyan)}

/* ---------- Sidebar footer: usage, expandable to all accounts (v2) ---------- */
.codd .sf-toggle{display:flex;align-items:center;gap:6px;width:100%;min-height:20px;background:transparent;border:0;padding:0;color:var(--dim);font-family:var(--mono);font-size:10.5px;cursor:pointer;text-align:left;white-space:nowrap}
.codd .sf-toggle:hover{color:var(--cream)}
.codd .sf-toggle .n{color:var(--amber-dim);font-variant-numeric:tabular-nums}
.codd .acctlist{display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.codd .acrow{display:flex;flex-direction:column;gap:3px;width:100%;padding:5px 6px 6px 8px;background:transparent;border:0;border-left:2px solid transparent;color:var(--bone);font-family:var(--mono);text-align:left;cursor:pointer}
.codd .acrow:hover{background:var(--bg-soft);border-left-color:var(--line-bright)}
.codd .acrow.on{background:var(--bg-lift);border-left-color:var(--amber);cursor:default}
.codd .acrow .a1{display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap}
.codd .acrow .a1 b{font-family:var(--display);font-weight:700;color:var(--cyan)}
.codd .acrow.on .a1 b{color:var(--amber)}
.codd .acrow .a1 .go{margin-left:auto;font-size:10px;letter-spacing:.06em;color:var(--dimmer)}
.codd .acrow:hover .a1 .go{color:var(--amber)}
.codd .acrow.on .a1 .go{color:var(--amber)}
.codd .acrow .q2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.codd .acrow .qrow{font-size:10.5px;gap:5px}
.codd .acrow .qrow .k{width:16px}
.codd .acrow .qrow .v{width:30px}

/* ---------- Menu bar status item: ONE icon, no counts (v2) ----------
   brand mark; inner square = state: .mbi (normal, currentColor) · .mbi.need (amber) · .mbi.nohook (hollow) */
.codd .mbi .core{fill:currentColor}
.codd .mbi.need .core{fill:var(--amber);filter:drop-shadow(0 0 3px rgba(255,184,74,.8))}
.codd .mbi.nohook .core{fill:none;stroke:currentColor;stroke-width:1.2}

/* ---------- Image annotations in notes (v2) ---------- */
.codd .ann-wrap{position:relative;display:inline-block}
.codd .ann-box{position:absolute;border:1.5px solid var(--amber);background:rgba(255,184,74,.10);box-shadow:0 0 0 1px rgba(0,0,0,.55)}
.codd .ann-box.sel{border-style:solid;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 10px var(--amber-glow)}
.codd .ann-pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;display:flex;align-items:center;justify-content:center;background:var(--amber);color:#000;font-family:var(--mono);font-size:10.5px;font-weight:700;box-shadow:0 0 0 1.5px #000,0 0 8px var(--amber-glow)}
.codd .ann-box .ann-pin{left:0;top:0}
.codd .ann-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.codd .ann-item{display:grid;grid-template-columns:20px minmax(0,1fr);gap:2px 8px;font-size:12px;color:var(--bone);line-height:1.45}
.codd .ann-item .no{grid-row:span 2;width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:var(--amber);color:#000;font-size:10.5px;font-weight:700}
.codd .ann-item .xy{font-size:10.5px;color:var(--dimmer);font-variant-numeric:tabular-nums}

/* ---------- Auto-switch threshold tick on quota bars (v3) ---------- */
.codd .bar10 i.thr{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--danger);z-index:1}
.codd .autosw{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);white-space:nowrap}
.codd .autosw .st{color:var(--dimmer);letter-spacing:.08em}
.codd .autosw.on .st{color:var(--success)}

/* ---------- Motion ---------- */
@keyframes codd-blink{50%{opacity:0}}
@keyframes codd-lamp{0%,100%{opacity:1;text-shadow:0 0 10px #ffb84a,0 0 2px #ffb84a}50%{opacity:.3;text-shadow:none}}
@keyframes codd-soft{50%{opacity:.45}}
@keyframes codd-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.codd *{animation:none !important}}
</style>
