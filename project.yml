name: CODD
options:
  bundleIdPrefix: app.codd
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    # M5 D18 / §2.1: the marketing version equals the repo's VERSION file; scripts/release.sh
    # passes the commit count as CURRENT_PROJECT_VERSION (Debug builds keep 1).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CoddHolder:
    path: Packages/CoddHolder
  CoddCore:
    path: Packages/CoddCore
  CoddTerminal:
    path: Packages/CoddTerminal
  CoddHooks:
    path: Packages/CoddHooks
  CoddComposer:
    path: Packages/CoddComposer
  # M3 (docs/M3-PLAN.md §4): design system, preferences, Claude settings installer, host metrics
  # and the STATUS / Settings / dialog UI packages.
  CoddUI:
    path: Packages/CoddUI
  CoddPreferences:
    path: Packages/CoddPreferences
  CoddClaudeSettings:
    path: Packages/CoddClaudeSettings
  CoddHost:
    path: Packages/CoddHost
  CoddStatusUI:
    path: Packages/CoddStatusUI
  CoddSettingsUI:
    path: Packages/CoddSettingsUI
  CoddDialogsUI:
    path: Packages/CoddDialogsUI
  # M4 (docs/M4-PLAN.md §4): notes storage and index (GRDB through it), the MCP server, the
  # Markdown and code editors, the file editor model and chrome, and the Notebook, ImageAnnotate
  # and Cleanup UI packages. The graph is final for every M4 integration step.
  CoddNotes:
    path: Packages/CoddNotes
  CoddMCP:
    path: Packages/CoddMCP
  CoddTextKit:
    path: Packages/CoddTextKit
  CoddCodeEditor:
    path: Packages/CoddCodeEditor
  CoddFiles:
    path: Packages/CoddFiles
  CoddNotebookUI:
    path: Packages/CoddNotebookUI
  CoddAnnotateUI:
    path: Packages/CoddAnnotateUI
  CoddCleanupUI:
    path: Packages/CoddCleanupUI
  # M5 (docs/M5-PLAN.md §2.2): the data files' versions, the launch preflight and the one-time
  # defaults copy (D2, D14).
  CoddDataStore:
    path: Packages/CoddDataStore
  # M5 (docs/M5-PLAN.md §2.3–§2.5): the first-launch wizard's models, import catalog, gate and
  # onboarding.json (CoddOnboarding) and its views (CoddOnboardingUI).
  CoddOnboarding:
    path: Packages/CoddOnboarding
targets:
  CODD:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Fonts/**"
          - "Tests/**"
          # The pinned package graph scripts/release.sh copies into the workspace (not a resource).
          - "Package.resolved"
      # Folder reference so the fonts land in Contents/Resources/Fonts (ATSApplicationFontsPath),
      # with their OFL texts (OFL-JetBrainsMono.txt, OFL-SpaceMono.txt) next to them.
      - path: App/Fonts
        type: folder
        buildPhase: resources
      # Every third-party license CODD ships (Settings › 關於 › 第三方元件授權 opens it).
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: CoddCore
        product: CoddCore
      - package: CoddHolder
        product: CoddProtocol
      # Spawner (posix_spawn SETSID | CLOEXEC_DEFAULT) and meta.json discovery for real-holder mode.
      - package: CoddHolder
        product: CoddHolderClient
      # libghostty terminal engine (one TerminalEngine per PTY tab).
      - package: CoddTerminal
        product: CoddTerminal
      # Hook endpoint, registry watcher and session state engine (hosted by the app in M1).
      - package: CoddHooks
        product: CoddHooks
      # The ⌘L prompt composer (IME-safe text view, drafts, history, PTY payload encoding).
      - package: CoddComposer
        product: CoddComposer
      # The Phosphor Console design system (D30): tokens, fonts, drawing, controls, M3 primitives.
      - package: CoddUI
        product: CoddUI
      # Settings model and <dataRoot>/preferences.json (D14).
      - package: CoddPreferences
        product: CoddPreferences
      # Claude user settings: status-line chain (D8 / D35) and the global installer (D10).
      - package: CoddClaudeSettings
        product: CoddClaudeSettings
      # HOST metrics and the main-thread latency probe (D26 / D36).
      - package: CoddHost
        product: CoddHost
      # STATUS page, Settings sections and the §7.7 dialogs (wired in I2 / I3).
      - package: CoddStatusUI
        product: CoddStatusUI
      - package: CoddSettingsUI
        product: CoddSettingsUI
      - package: CoddDialogsUI
        product: CoddDialogsUI
      # M4: notes (files, index, watcher, AI text; D1–D10), the in-app MCP server (D16, D17), the
      # TextKit 1 Markdown and code editors (D11), the file editor model + chrome (D24–D27), and
      # the Notebook / ImageAnnotate / Cleanup artboard views.
      - package: CoddNotes
        product: CoddNotes
      - package: CoddMCP
        product: CoddMCP
      - package: CoddTextKit
        product: CoddTextKit
      - package: CoddCodeEditor
        product: CoddCodeEditor
      - package: CoddFiles
        product: CoddFiles
      - package: CoddFiles
        product: CoddFileEditorUI
      - package: CoddNotebookUI
        product: CoddNotebookUI
      - package: CoddAnnotateUI
        product: CoddAnnotateUI
      - package: CoddCleanupUI
        product: CoddCleanupUI
      # M5: the launch preflight over the data root, the newer-file write guard and the defaults copy.
      - package: CoddDataStore
        product: CoddDataStore
      # M5 I2: the onboarding window (D5–D13).
      - package: CoddOnboarding
        product: CoddOnboarding
      - package: CoddOnboarding
        product: CoddOnboardingUI
      # Built first; copied into Contents/MacOS by the "Embed codd-holder" phase below.
      - target: codd-holder
        embed: false
        link: false
      # Built first; copied into Contents/MacOS by the "Embed codd-hook" phase below.
      - target: codd-hook
        embed: false
        link: false
      # Built first; copied into Contents/MacOS by the "Embed codd-statusline" phase below.
      - target: codd-statusline
        embed: false
        link: false
    postBuildScripts:
      - name: Embed codd-holder
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/codd-holder
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/codd-holder
        script: |
          set -euo pipefail
          src="${BUILT_PRODUCTS_DIR}/codd-holder"
          dst="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/codd-holder"
          mkdir -p "$(dirname "$dst")"
          # Always a new inode: holders outlive the app and keep running from the old file, and
          # rewriting a mapped, signed executable in place makes the kernel kill them.
          rm -f "$dst"
          cp "$src" "$dst"
          codesign --force --sign - --timestamp=none --identifier app.codd.codd-holder "$dst"
      - name: Embed codd-hook
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/codd-hook
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/codd-hook
        script: |
          set -euo pipefail
          src="${BUILT_PRODUCTS_DIR}/codd-hook"
          dst="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/codd-hook"
          mkdir -p "$(dirname "$dst")"
          # A new inode like codd-holder: a SessionStart hook may be running it right now.
          rm -f "$dst"
          cp "$src" "$dst"
          codesign --force --sign - --timestamp=none --identifier app.codd.codd-hook "$dst"
      - name: Embed codd-statusline
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/codd-statusline
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/codd-statusline
        script: |
          set -euo pipefail
          src="${BUILT_PRODUCTS_DIR}/codd-statusline"
          dst="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/codd-statusline"
          mkdir -p "$(dirname "$dst")"
          # A new inode like codd-hook: a claude status-line refresh may be running it right now.
          rm -f "$dst"
          cp "$src" "$dst"
          codesign --force --sign - --timestamp=none --identifier app.codd.codd-statusline "$dst"
    info:
      path: App/Info.plist
      properties:
        CFBundleName: CODD
        CFBundleDisplayName: CODD
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
        ATSApplicationFontsPath: Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.codd.CODD
        PRODUCT_NAME: CODD
        # Icon Composer document App/AppIcon.icon (default, dark, clear and tinted); actool also writes AppIcon.icns.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The app has no App Intents; silence the extractor's "no AppIntents.framework" notice.
        LM_SKIP_METADATA_EXTRACTION: YES
  # Unit tests for the app shell (Swift Testing), hosted by CODD.app. Sources: App/Tests.
  CODDTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: CODD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.codd.CODDTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CODD.app/Contents/MacOS/CODD"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LM_SKIP_METADATA_EXTRACTION: YES
  codd-holder:
    type: tool
    platform: macOS
    sources:
      - path: Tools/codd-holder
    dependencies:
      - package: CoddHolder
        product: CoddHolderCore
    settings:
      base:
        PRODUCT_NAME: codd-holder
        SKIP_INSTALL: YES
        # One self-contained executable (no .debug.dylib split): the app copies just this file.
        ENABLE_DEBUG_DYLIB: NO
        # Drops the Foundation load command the toolchain adds to every Swift executable; the holder
        # does not use Foundation (idle footprint 1.6 MB with it dropped, 2.0 MB without).
        OTHER_LDFLAGS: "-Xlinker -dead_strip_dylibs"
  # Claude Code SessionStart command hook (stdin JSON → POST to the in-app hook endpoint).
  codd-hook:
    type: tool
    platform: macOS
    sources:
      - path: Tools/codd-hook
    dependencies:
      - package: CoddHooks
        product: CoddHookClient
    settings:
      base:
        PRODUCT_NAME: codd-hook
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
        # It runs on every claude SessionStart: no Foundation load command, minimal dyld work.
        OTHER_LDFLAGS: "-Xlinker -dead_strip_dylibs"
  # Claude Code status-line command of CODD sessions (M3 D8): stdin JSON → POST /statusline, then
  # the user's own status line chained through /bin/sh.
  codd-statusline:
    type: tool
    platform: macOS
    sources:
      - path: Tools/codd-statusline
    dependencies:
      - package: CoddHooks
        product: CoddHookClient
    settings:
      base:
        PRODUCT_NAME: codd-statusline
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
        # It runs on every status-line refresh: no Foundation load command, minimal dyld work.
        OTHER_LDFLAGS: "-Xlinker -dead_strip_dylibs"
schemes:
  CODD:
    build:
      targets:
        CODD: all
        codd-holder: all
        codd-hook: all
        codd-statusline: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CODDTests
